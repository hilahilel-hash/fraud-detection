name: Investigate Hidden Fraud - Cross Table

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install google-cloud-bigquery db-dtypes pyarrow pandas google-auth google-auth-httplib2

      - name: Run cross-table investigation
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import os, json, pandas as pd
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from google.cloud import bigquery

          creds_info = json.loads(os.environ["GCP_CREDENTIALS"])
          creds = Credentials(
              token=None,
              refresh_token=creds_info["refresh_token"],
              token_uri=creds_info.get("token_uri", "https://oauth2.googleapis.com/token"),
              client_id=creds_info["client_id"],
              client_secret=creds_info["client_secret"],
          )
          creds.refresh(Request())
          client = bigquery.Client(project="fiverr-bq-payments-adhoc-prod", credentials=creds)
          os.makedirs("/tmp/investigation2", exist_ok=True)

          # ── Step 0: Discover relevant tables in dwh ────────────────────────
          q0 = """
          SELECT table_name
          FROM `fiverr-dwh-data-prod.dwh.INFORMATION_SCHEMA.TABLES`
          WHERE REGEXP_CONTAINS(LOWER(table_name), r'user|login|session|security|account|event|device|ip|geo|audit|activity|chargeback|risk|fraud')
          ORDER BY table_name
          """
          df0 = client.query(q0).to_dataframe()
          df0.to_csv("/tmp/investigation2/q0_available_tables.csv", index=False)
          print("Q0 - Available relevant tables:", df0.shape[0])
          print(df0["table_name"].to_string())

          # ── Step 1: Define hidden fraud vs legit control group ─────────────
          # Hidden fraud: confirmed fraud, no clone behavior, established account
          # Control: confirmed legit, same profile (no clone, established)
          # Both groups: last 180 days to get enough cases
          hidden_fraud_def = """
            SELECT DISTINCT user_id, 'hidden_fraud' AS grp
            FROM `fiverr-dwh-data-prod.dwh.dm_paypal_fraud_weekly`
            WHERE _PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
              AND has_chargeback = 1
              AND buyer_count_clone < 2
              AND days_since_signup > 365
          """
          legit_control_def = """
            SELECT DISTINCT user_id, 'legit_established' AS grp
            FROM `fiverr-dwh-data-prod.dwh.dm_paypal_fraud_weekly`
            WHERE _PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
              AND has_chargeback = 0
              AND buyer_count_clone < 2
              AND days_since_signup > 365
            LIMIT 5000
          """

          # ── Query 1: obt_orders — communication & order behavior ──────────
          q1 = f"""
          WITH hf AS ({hidden_fraud_def}),
               lg AS ({legit_control_def}),
               both AS (SELECT * FROM hf UNION ALL SELECT * FROM lg)
          SELECT
            b.grp,
            COUNT(DISTINCT o.order_id) AS n_orders,
            COUNT(DISTINCT b.user_id) AS n_users,
            ROUND(AVG(CAST(o.is_custom_offer AS INT64)), 3) AS pct_custom_offer,
            ROUND(AVG(CAST(o.has_buyer_msg AS INT64)), 3) AS pct_has_buyer_msg,
            ROUND(AVG(CAST(o.is_auto_complete AS INT64)), 3) AS pct_auto_complete,
            ROUND(AVG(SAFE_CAST(o.order_amount AS FLOAT64)), 2) AS avg_amount,
            ROUND(AVG(DATE_DIFF(DATE(o.placed_at), DATE(o.last_buyer_activity_at), DAY)), 1) AS avg_days_since_last_activity,
            ROUND(AVG(o.buyer_orders_count), 1) AS avg_buyer_order_count
          FROM `fiverr-dwh-data-prod.dwh.obt_orders` o
          JOIN both b ON o.buyer_id = CAST(b.user_id AS STRING)
          WHERE o._PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          GROUP BY 1
          """
          try:
              df1 = client.query(q1).to_dataframe()
              df1.to_csv("/tmp/investigation2/q1_obt_orders_behavior.csv", index=False)
              print("\nQ1 - obt_orders behavior:")
              print(df1.to_string())
          except Exception as e:
              print(f"\nQ1 failed: {e}")
              pd.DataFrame({"error": [str(e)]}).to_csv("/tmp/investigation2/q1_obt_orders_behavior.csv", index=False)

          # ── Query 2: obt_orders — gig category breakdown ──────────────────
          q2 = f"""
          WITH hf AS ({hidden_fraud_def}),
               lg AS ({legit_control_def}),
               both AS (SELECT * FROM hf UNION ALL SELECT * FROM lg)
          SELECT
            b.grp,
            o.sub_category_name,
            COUNT(*) AS n_orders,
            ROUND(AVG(SAFE_CAST(o.order_amount AS FLOAT64)), 2) AS avg_amount
          FROM `fiverr-dwh-data-prod.dwh.obt_orders` o
          JOIN both b ON o.buyer_id = CAST(b.user_id AS STRING)
          WHERE o._PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          GROUP BY 1, 2
          ORDER BY 1, 3 DESC
          """
          try:
              df2 = client.query(q2).to_dataframe()
              df2.to_csv("/tmp/investigation2/q2_gig_categories.csv", index=False)
              print("\nQ2 - Gig categories:")
              print(df2.head(30).to_string())
          except Exception as e:
              print(f"\nQ2 failed: {e}")
              pd.DataFrame({"error": [str(e)]}).to_csv("/tmp/investigation2/q2_gig_categories.csv", index=False)

          # ── Query 3: dim_users — account profile at time of fraud ─────────
          q3 = f"""
          WITH hf AS ({hidden_fraud_def}),
               lg AS ({legit_control_def}),
               both AS (SELECT * FROM hf UNION ALL SELECT * FROM lg)
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS n_users,
            ROUND(AVG(DATE_DIFF(CURRENT_DATE(), DATE(u.created_at), DAY)), 0) AS avg_account_age_days,
            ROUND(AVG(DATE_DIFF(CURRENT_DATE(), DATE(u.last_login_at), DAY)), 1) AS avg_days_since_last_login,
            ROUND(AVG(DATE_DIFF(CURRENT_DATE(), DATE(u.updated_at), DAY)), 1) AS avg_days_since_profile_update,
            ROUND(AVG(CAST(u.is_email_verified AS INT64)), 3) AS pct_email_verified,
            ROUND(AVG(CAST(u.is_phone_verified AS INT64)), 3) AS pct_phone_verified,
            COUNTIF(DATE_DIFF(CURRENT_DATE(), DATE(u.updated_at), DAY) <= 30) AS updated_last_30d,
            COUNTIF(DATE_DIFF(CURRENT_DATE(), DATE(u.last_login_at), DAY) > 90) AS dormant_90d
          FROM `fiverr-dwh-data-prod.dwh.dim_users` u
          JOIN both b ON CAST(u.user_id AS STRING) = CAST(b.user_id AS STRING)
          GROUP BY 1
          """
          try:
              df3 = client.query(q3).to_dataframe()
              df3.to_csv("/tmp/investigation2/q3_dim_users_profile.csv", index=False)
              print("\nQ3 - User profile:")
              print(df3.to_string())
          except Exception as e:
              print(f"\nQ3 failed: {e}")
              pd.DataFrame({"error": [str(e)]}).to_csv("/tmp/investigation2/q3_dim_users_profile.csv", index=False)

          # ── Query 4: country/geo mismatch ─────────────────────────────────
          # Compare country_code in fraud table vs country in dim_users
          q4 = f"""
          WITH hf AS ({hidden_fraud_def}),
               lg AS ({legit_control_def}),
               both AS (SELECT * FROM hf UNION ALL SELECT * FROM lg),
               fraud_txns AS (
                 SELECT f.user_id, f.country_code AS txn_country, f.has_chargeback
                 FROM `fiverr-dwh-data-prod.dwh.dm_paypal_fraud_weekly` f
                 JOIN both b ON f.user_id = b.user_id
                 WHERE f._PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
                   AND f.buyer_count_clone < 2
                   AND f.days_since_signup > 365
               )
          SELECT
            b.grp,
            COUNT(*) AS n,
            COUNTIF(f.txn_country != u.country) AS geo_mismatch_count,
            ROUND(COUNTIF(f.txn_country != u.country) / COUNT(*), 3) AS geo_mismatch_rate,
            ROUND(AVG(CAST(f.has_chargeback AS INT64)), 4) AS fraud_rate
          FROM fraud_txns f
          JOIN `fiverr-dwh-data-prod.dwh.dim_users` u ON CAST(f.user_id AS STRING) = CAST(u.user_id AS STRING)
          JOIN both b ON f.user_id = b.user_id
          GROUP BY 1
          """
          try:
              df4 = client.query(q4).to_dataframe()
              df4.to_csv("/tmp/investigation2/q4_geo_mismatch.csv", index=False)
              print("\nQ4 - Geo mismatch:")
              print(df4.to_string())
          except Exception as e:
              print(f"\nQ4 failed: {e}")
              pd.DataFrame({"error": [str(e)]}).to_csv("/tmp/investigation2/q4_geo_mismatch.csv", index=False)

          print("\n✓ All queries done.")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: hidden-fraud-cross-table
          path: /tmp/investigation2/
          retention-days: 7
