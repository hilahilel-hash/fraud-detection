name: Investigate Hidden Fraud - Schema + Deep Analysis

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install google-cloud-bigquery db-dtypes pyarrow pandas google-auth google-auth-httplib2

      - name: Run schema discovery + deep analysis
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python3 - << 'PYEOF'
          import os, json, pandas as pd
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from google.cloud import bigquery

          creds_info = json.loads(os.environ["GCP_CREDENTIALS"])
          creds = Credentials(
              token=None,
              refresh_token=creds_info["refresh_token"],
              token_uri=creds_info.get("token_uri", "https://oauth2.googleapis.com/token"),
              client_id=creds_info["client_id"],
              client_secret=creds_info["client_secret"],
          )
          creds.refresh(Request())
          client = bigquery.Client(project="fiverr-bq-payments-adhoc-prod", credentials=creds)
          os.makedirs("/tmp/investigation3", exist_ok=True)

          def run(label, sql):
              try:
                  df = client.query(sql).to_dataframe()
                  df.to_csv(f"/tmp/investigation3/{label}.csv", index=False)
                  print(f"\n✓ {label}: {df.shape}")
                  print(df.to_string())
                  return df
              except Exception as e:
                  print(f"\n✗ {label} FAILED: {e}")
                  pd.DataFrame({"error": [str(e)]}).to_csv(f"/tmp/investigation3/{label}.csv", index=False)
                  return None

          # ── Get schemas of target tables ───────────────────────────────────
          tables_to_inspect = [
              'ms_suspicious_fake_Location_user',
              'ms_user_behavioral',
              'ms_bad_ips',
              'ms_users_countries',
              'obt_users',
              'dim_user_details',
              'ms_user_warnings',
              'agg_dynamic_user_daily',
              'agg_chargebacks',
              'dim_chargeback',
          ]
          for tbl in tables_to_inspect:
              run(f"schema_{tbl}", f"""
                  SELECT column_name, data_type
                  FROM `fiverr-dwh-data-prod.dwh.INFORMATION_SCHEMA.COLUMNS`
                  WHERE table_name = '{tbl}'
                  ORDER BY ordinal_position
              """)

          # ── Hidden fraud population (last 180 days) ────────────────────────
          # user_id is INT64 in dm_paypal_fraud_weekly — use as INT64 throughout
          HIDDEN_FRAUD = """
            SELECT DISTINCT user_id
            FROM `fiverr-dwh-data-prod.dwh.dm_paypal_fraud_weekly`
            WHERE _PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
              AND has_chargeback = 1
              AND buyer_count_clone < 2
              AND days_since_signup > 365
          """
          LEGIT_CONTROL = """
            SELECT DISTINCT user_id
            FROM `fiverr-dwh-data-prod.dwh.dm_paypal_fraud_weekly`
            WHERE _PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
              AND has_chargeback = 0
              AND buyer_count_clone < 2
              AND days_since_signup > 365
            LIMIT 5000
          """

          # ── Q1: ms_suspicious_fake_Location_user ───────────────────────────
          run("q1_fake_location", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               )
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS total_users,
            COUNT(DISTINCT t.user_id) AS users_with_fake_location,
            ROUND(COUNT(DISTINCT t.user_id) / COUNT(DISTINCT b.user_id), 3) AS pct_fake_location
          FROM both b
          LEFT JOIN `fiverr-dwh-data-prod.dwh.ms_suspicious_fake_Location_user` t
            ON b.user_id = t.user_id
          GROUP BY 1
          """)

          # ── Q2: ms_users_countries — multi-country usage ───────────────────
          run("q2_multi_country", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               ),
               country_counts AS (
                 SELECT user_id, COUNT(DISTINCT country) AS n_countries
                 FROM `fiverr-dwh-data-prod.dwh.ms_users_countries`
                 GROUP BY 1
               )
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS n_users,
            ROUND(AVG(COALESCE(c.n_countries, 1)), 2) AS avg_countries,
            COUNTIF(COALESCE(c.n_countries, 1) >= 3) AS users_3plus_countries,
            ROUND(COUNTIF(COALESCE(c.n_countries, 1) >= 3) / COUNT(DISTINCT b.user_id), 3) AS pct_3plus_countries
          FROM both b
          LEFT JOIN country_counts c ON b.user_id = c.user_id
          GROUP BY 1
          """)

          # ── Q3: ms_user_behavioral — behavioral flags ──────────────────────
          run("q3_behavioral", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               )
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS n_users,
            COUNT(DISTINCT beh.user_id) AS users_in_behavioral,
            AVG(beh.risk_score) AS avg_risk_score
          FROM both b
          LEFT JOIN `fiverr-dwh-data-prod.dwh.ms_user_behavioral` beh ON b.user_id = beh.user_id
          GROUP BY 1
          """)

          # ── Q4: ms_bad_ips — IP reputation ────────────────────────────────
          run("q4_bad_ips", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               ),
               fraud_ips AS (
                 SELECT DISTINCT f.user_id, f.ip
                 FROM `fiverr-dwh-data-prod.dwh.dm_paypal_fraud_weekly` f
                 JOIN both b ON f.user_id = b.user_id
                 WHERE f._PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
                   AND f.buyer_count_clone < 2 AND f.days_since_signup > 365
               )
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS n_users,
            COUNTIF(bad.ip IS NOT NULL) AS users_with_bad_ip,
            ROUND(COUNTIF(bad.ip IS NOT NULL) / COUNT(DISTINCT b.user_id), 3) AS pct_bad_ip
          FROM both b
          LEFT JOIN fraud_ips fi ON b.user_id = fi.user_id
          LEFT JOIN `fiverr-dwh-data-prod.dwh.ms_bad_ips` bad ON fi.ip = bad.ip
          GROUP BY 1
          """)

          # ── Q5: ms_user_warnings ───────────────────────────────────────────
          run("q5_warnings", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               )
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS n_users,
            COUNT(DISTINCT w.user_id) AS users_with_warnings,
            ROUND(COUNT(DISTINCT w.user_id) / COUNT(DISTINCT b.user_id), 3) AS pct_with_warnings
          FROM both b
          LEFT JOIN `fiverr-dwh-data-prod.dwh.ms_user_warnings` w ON b.user_id = w.user_id
          GROUP BY 1
          """)

          # ── Q6: obt_orders — communication before order (INT64 join) ──────
          run("q6_obt_orders_comm", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               )
          SELECT
            b.grp,
            COUNT(DISTINCT o.order_id) AS n_orders,
            COUNT(DISTINCT b.user_id) AS n_users,
            ROUND(AVG(CAST(o.has_buyer_msg AS INT64)), 3) AS pct_has_buyer_msg,
            ROUND(AVG(CAST(o.is_custom_offer AS INT64)), 3) AS pct_custom_offer,
            ROUND(AVG(CAST(o.is_auto_complete AS INT64)), 3) AS pct_auto_complete,
            ROUND(AVG(SAFE_CAST(o.order_amount AS FLOAT64)), 2) AS avg_amount
          FROM `fiverr-dwh-data-prod.dwh.obt_orders` o
          JOIN both b ON o.buyer_id = b.user_id
          WHERE o._PARTITIONdate BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 180 DAY) AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          GROUP BY 1
          """)

          # ── Q7: agg_dynamic_user_daily — dormancy before fraud ─────────────
          run("q7_dormancy", f"""
          WITH hf AS ({HIDDEN_FRAUD}),
               lg AS ({LEGIT_CONTROL}),
               both AS (
                 SELECT user_id, 'hidden_fraud' AS grp FROM hf
                 UNION ALL
                 SELECT user_id, 'legit_established' AS grp FROM lg
               ),
               last_activity AS (
                 SELECT user_id, MAX(activity_date) AS last_active_date
                 FROM `fiverr-dwh-data-prod.dwh.agg_dynamic_user_daily`
                 WHERE activity_date < DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
                 GROUP BY 1
               )
          SELECT
            b.grp,
            COUNT(DISTINCT b.user_id) AS n_users,
            ROUND(AVG(DATE_DIFF(CURRENT_DATE(), la.last_active_date, DAY)), 1) AS avg_days_since_last_active,
            COUNTIF(DATE_DIFF(CURRENT_DATE(), la.last_active_date, DAY) > 90) AS dormant_90d,
            COUNTIF(DATE_DIFF(CURRENT_DATE(), la.last_active_date, DAY) > 30) AS dormant_30d,
            ROUND(COUNTIF(DATE_DIFF(CURRENT_DATE(), la.last_active_date, DAY) > 90) / COUNT(DISTINCT b.user_id), 3) AS pct_dormant_90d
          FROM both b
          LEFT JOIN last_activity la ON b.user_id = la.user_id
          GROUP BY 1
          """)

          print("\n✓ All done.")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: hidden-fraud-deep
          path: /tmp/investigation3/
          retention-days: 7
